<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NullOS v14.5</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
          --accent: rgba(255, 255, 255, 0.12);
          --panel: rgba(10, 10, 10, 0.8);
          --border: rgba(255, 255, 255, 0.15);
          --wallpaper: url('https://wallpapercave.com/wp/wp10117157.jpg');
      }

      body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: #000; color: #fff; overflow: hidden; user-select: none; }
      #os-screen { position: relative; width: 100%; height: 100%; background: var(--wallpaper) center/cover no-repeat; transition: background 0.5s ease; }

      /* --- ANIMATIONS --- */
      @keyframes winOpen {
        from { transform: scale(0.8); opacity: 0; filter: blur(10px); }
        to { transform: scale(1); opacity: 1; filter: blur(0); }
      }
      @keyframes winClose {
        from { transform: scale(1); opacity: 1; filter: blur(0); }
        to { transform: scale(0.9); opacity: 0; filter: blur(10px); }
      }
      @keyframes iconEnter {
        from { transform: scale(0) rotate(-10deg); opacity: 0; }
        to { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes iconDelete {
        to { transform: scale(0); opacity: 0; }
      }

      /* --- DESKTOP --- */
      #desktop { height: calc(100vh - 60px); width: 100%; position: relative; padding: 30px; z-index: 10; box-sizing: border-box; }
      .icon { position: absolute; width: 100px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.2s ease; cursor: pointer; animation: iconEnter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .icon.deleting { animation: iconDelete 0.3s forwards; }
      .icon:hover { transform: translateY(-5px); }
      .icon-box { width: 65px; height: 65px; background: var(--accent); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); pointer-events: none; }
      .icon span { font-size: 0.75rem; font-weight: 500; margin-top: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; width: 110px; pointer-events: none; }

      /* --- WINDOWS --- */
      .window { 
        position: absolute; width: 950px; height: 650px; background: var(--panel); backdrop-filter: blur(50px); 
        border: 1px solid var(--border); border-radius: 15px; box-shadow: 0 30px 70px rgba(0,0,0,0.7); 
        display: flex; flex-direction: column; overflow: hidden; z-index: 1000; 
        animation: winOpen 0.4s cubic-bezier(0.17, 0.88, 0.32, 1.05);
        will-change: left, top;
      }

      .window.closing { animation: winClose 0.2s ease forwards; pointer-events: none; }
      .window.maximized { width: 100% !important; height: calc(100vh - 60px) !important; top: 0 !important; left: 0 !important; border-radius: 0; z-index: 9999 !important; transition: all 0.25s ease; }
      .window.minimized { transform: scale(0.6) translateY(500px); opacity: 0; pointer-events: none; }

      .title-bar { height: 45px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; cursor: move; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .win-ctrls { display: flex; gap: 8px; }
      .ctrl { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; }
      .c-red { background: #ff5f57; } .c-yel { background: #febc2e; } .c-grn { background: #28c840; }

      /* --- TASKBAR --- */
      #taskbar { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(10,10,10,0.6); backdrop-filter: blur(30px); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 10001; box-sizing: border-box; }
      .tb-logo { width: 32px; height: 32px; margin-right: 12px; border-radius: 6px; }
      .tb-brand { font-weight: 800; font-size: 0.9rem; margin-right: 25px; color: #fff; }
      .tb-apps { flex: 1; display: flex; justify-content: center; gap: 12px; }
      .tb-item { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid var(--border); cursor: pointer; transition: 0.2s; animation: iconEnter 0.3s ease; }
      #tb-time { font-weight: 600; font-size: 1rem; width: 110px; text-align: right; }

      /* --- UI ELEMENTS --- */
      .scroll-area { flex: 1; padding: 25px; overflow-y: auto; height: 100%; box-sizing: border-box; }
      .btn { background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 25px; transition: 0.2s; }
      .btn:hover { background: #eee; }
      .btn-opt { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); margin-bottom: 15px; text-align: left; padding: 20px; display: flex; align-items: center; gap: 15px; border-radius: 12px; cursor: pointer; }

      input, textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
      .icon-selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-top: 10px; height: 150px; overflow-y: scroll; border: 1px solid #333; }
      .fa-pick { font-size: 1.2rem; padding: 10px; background: #111; border-radius: 5px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .fa-pick:hover { background: #fff; color: #000; }
      .small-txt-btn { color: #888; font-size: 0.8rem; margin-left: 10px; cursor: pointer; text-decoration: underline; }

      #ctx { position: fixed; background: #151515; border: 1px solid #333; border-radius: 8px; width: 170px; display: none; z-index: 15000; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      .ctx-item { padding: 10px; font-size: 0.8rem; cursor: pointer; border-radius: 4px; }
      .ctx-item:hover { background: #fff; color: #000; }
      iframe { width: 100%; height: 100%; border: none; border-radius: 8px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="os-screen">
      <div id="desktop"></div>
      <div id="taskbar">
        <img
          src="https://media.discordapp.net/attachments/982219650861514773/1460882260868993107/Picsart_26-01-14_09-22-36-076.png?ex=69688820&is=696736a0&hm=9b62b6fa59129c54a8433011adc017ded5a652fb4eafbab2e8bbc3979256883b&=&format=webp&quality=lossless&width=1178&height=1178"
          class="tb-logo"
        />
        <div class="tb-brand">NullOS</div>
        <div class="tb-apps" id="tb-active"></div>
        <div id="tb-time">00:00</div>
      </div>
      <div id="ctx">
        <div class="ctx-item" onclick="handleCtx('edit')">Edit</div>
        <div
          id="ctx-delete-btn"
          class="ctx-item"
          style="color:#ff5f57"
          onclick="handleCtx('delete')"
        >
          Delete
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'nullos_v14_3';
      const FA_ICONS = ['fa-cube','fa-gamepad','fa-code','fa-globe','fa-bolt','fa-ghost','fa-robot','fa-skull','fa-heart','fa-star','fa-cloud','fa-music','fa-video','fa-terminal','fa-folder','fa-user','fa-message','fa-gear','fa-link','fa-image'];

      let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
          accent: 'rgba(255, 255, 255, 0.12)',
          wallpaper: 'https://wallpapercave.com/wp/wp10117157.jpg',
          apps: [
              {n: 'Studio', i: 'fa-solid fa-palette', u: '', html: '', sys: true, x: 0, y: 0},
              {n: 'Custom', i: 'fa-solid fa-plus', u: '', html: '', sys: true, x: 1, y: 0}
          ]
      };

      let zIdx = 1000;
      let contextIdx = null;

      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

      function updateClock() {
          const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
          document.getElementById('tb-time').innerText = t;
      }
      setInterval(updateClock, 1000); updateClock();

      function renderDesktop() {
          const d = document.getElementById('desktop'); d.innerHTML = '';
          state.apps.forEach((app, i) => {
              const div = document.createElement('div');
              div.className = 'icon'; div.id = `icon-${i}`;
              div.style.left = (app.x * 120 + 30) + 'px'; div.style.top = (app.y * 120 + 30) + 'px';
              let iconInner = app.i.startsWith('fa') ? `<i class="${app.i}"></i>` : `<img src="${app.i}">`;
              div.innerHTML = `<div class="icon-box">${iconInner}</div><span>${app.n}</span>`;
              
              div.onmousedown = (e) => {
                  if(e.button === 2) return;
                  let moved = false;
                  let startX = e.clientX, startY = e.clientY;
                  let origX = div.offsetLeft, origY = div.offsetTop;
                  
                  const onMouseMove = (me) => {
                      moved = true;
                      div.style.left = (origX + me.clientX - startX) + 'px';
                      div.style.top = (origY + me.clientY - startY) + 'px';
                  };

                  const onMouseUp = () => {
                      document.removeEventListener('mousemove', onMouseMove);
                      document.removeEventListener('mouseup', onMouseUp);
                      app.x = Math.round((parseInt(div.style.left)-30)/120);
                      app.y = Math.round((parseInt(div.style.top)-30)/120);
                      div.style.left = (app.x * 120 + 30) + 'px'; div.style.top = (app.y * 120 + 30) + 'px';
                      save(); if(!moved) openApp(i);
                  };

                  document.addEventListener('mousemove', onMouseMove);
                  document.addEventListener('mouseup', onMouseUp);
              };
              div.oncontextmenu = (e) => { e.preventDefault(); contextIdx = i; const m = document.getElementById('ctx'); document.getElementById('ctx-delete-btn').style.display = state.apps[i].sys ? 'none' : 'block'; m.style.display = 'block'; m.style.left = e.clientX+'px'; m.style.top = e.clientY+'px'; };
              d.appendChild(div);
          });
      }

      function openApp(idx) {
          const app = state.apps[idx];
          if(document.getElementById(`win-${app.n}`)) return focusWin(app.n);
          const win = document.createElement('div');
          win.id = `win-${app.n}`; win.className = 'window'; win.dataset.icon = app.i;
          win.style.left = '100px'; win.style.top = '100px'; win.style.zIndex = ++zIdx;
          win.innerHTML = `<div class="title-bar" onmousedown="dragWin(this.parentElement, event)"><span>${app.n}</span><div class="win-ctrls"><button class="ctrl c-yel" onclick="toggleMin('${app.n}')"></button><button class="ctrl c-grn" onclick="toggleMax('${app.n}')"></button><button class="ctrl c-red" onclick="closeApp('${app.n}')"></button></div></div><div class="scroll-area" id="body-${app.n}"></div>`;
          document.getElementById('os-screen').appendChild(win);
          renderContent(app.n, idx);
          updateTaskbar();
      }

      function renderContent(name, idx) {
          const app = state.apps[idx];
          const b = document.getElementById(`body-${name}`);
          if(name === 'Studio') {
              b.innerHTML = `<h3>Theme</h3><div style="display:flex; gap:10px;"><button class="btn" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid #444; margin-top:0;" onclick="setTheme('rgba(255,255,255,0.12)')">Glass</button><button class="btn" style="background:#000; color:#fff; margin-top:0;" onclick="setTheme('linear-gradient(135deg, #000, #111)')">Black</button></div><h3>Wallpaper</h3><input id="w-in" value="${state.wallpaper}"><button class="btn" onclick="setWall(document.getElementById('w-in').value)">Apply</button>`;
          } else if(name === 'Custom') {
              b.innerHTML = `<div class="btn-opt" onclick="renderCustomForm('url')"><i class="fa-solid fa-link"></i><div><strong>URL</strong><br><small>Link a website</small></div></div><div class="btn-opt" onclick="renderCustomForm('html')"><i class="fa-solid fa-code"></i><div><strong>HTML</strong><br><small>Paste source code</small></div></div>`;
          } else if(app.html) {
              const ifr = document.createElement('iframe'); b.appendChild(ifr); ifr.contentWindow.document.open(); ifr.contentWindow.document.write(app.html); ifr.contentWindow.document.close();
          } else if(app.u) {
              b.innerHTML = `<iframe src="${app.u}"></iframe>`;
          }
      }

      function renderCustomForm(type) {
          const b = document.getElementById('body-Custom');
          b.innerHTML = `<h3>Install Module</h3>
              <input id="in-n" placeholder="Name">
              <div>
                  <button class="btn" style="width:auto; display:inline-block; margin-top:0;" onclick="toggleIconGrid()">Select Icon</button>
                  <span class="small-txt-btn" onclick="toggleUploadInput()">or upload URL</span>
                  <input id="in-i" placeholder="Icon URL" style="display:none; margin-top:15px;">
                  <div id="icon-grid" class="icon-selector-grid" style="display:none;"></div>
              </div><div style="margin-top:20px;"></div>` +
              (type === 'url' ? `<input id="in-u" placeholder="URL">` : `<textarea id="in-h" placeholder="Source Code"></textarea>`) +
              `<button class="btn" onclick="finishInstall('${type}')">Install</button>`;

          const grid = document.getElementById('icon-grid');
          FA_ICONS.forEach(ic => {
              const iEl = document.createElement('div'); iEl.className = 'fa-pick'; iEl.innerHTML = `<i class="fa-solid ${ic}"></i>`;
              iEl.onclick = () => { document.getElementById('in-i').value = `fa-solid ${ic}`; toggleIconGrid(); };
              grid.appendChild(iEl);
          });
      }

      function toggleIconGrid() { const g = document.getElementById('icon-grid'); g.style.display = g.style.display === 'none' ? 'grid' : 'none'; }
      function toggleUploadInput() { const inp = document.getElementById('in-i'); inp.style.display = inp.style.display === 'none' ? 'block' : 'none'; }

      function finishInstall(type) {
          const n = document.getElementById('in-n').value;
          let i = document.getElementById('in-i').value || 'fa-solid fa-cube';
          if(!n) return;
          const nextX = state.apps.length % 8; const nextY = Math.floor(state.apps.length / 8);
          const newApp = {n, i, x: nextX, y: nextY, sys: false};
          if(type === 'url') newApp.u = document.getElementById('in-u').value;
          else newApp.html = document.getElementById('in-h').value;
          state.apps.push(newApp); save(); renderDesktop(); closeApp('Custom');
      }

      function toggleMax(n) {
          const w = document.getElementById(`win-${n}`);
          w.classList.toggle('maximized');
          focusWin(n);
      }

      function toggleMin(n) { document.getElementById(`win-${n}`).classList.toggle('minimized'); }
      
      function closeApp(n) { 
          const win = document.getElementById(`win-${n}`);
          win.classList.add('closing');
          setTimeout(() => {
              win.remove(); 
              updateTaskbar();
          }, 200);
      }

      function focusWin(n) { const w = document.getElementById(`win-${n}`); if(w) w.style.zIndex = ++zIdx; }

      function handleCtx(type) {
          const app = state.apps[contextIdx];
          if(type === 'edit') {
              const win = document.createElement('div'); win.className='window'; win.style.width='300px'; win.style.height='auto'; win.style.left='40%'; win.style.top='30%'; win.style.zIndex=30000; win.id='win-Ed';
              win.innerHTML = `<div class="title-bar"><span>Edit</span><button class="ctrl c-red" onclick="this.parentElement.parentElement.remove()"></button></div><div style="padding:20px;"><input id="ed-n" value="${app.n}"><input id="ed-i" value="${app.i}"><button class="btn" onclick="updateApp(${contextIdx})">Save</button></div>`;
              document.getElementById('os-screen').appendChild(win);
          } else if(type === 'delete' && !app.sys) { 
              document.getElementById(`icon-${contextIdx}`).classList.add('deleting');
              setTimeout(() => {
                state.apps.splice(contextIdx, 1); save(); renderDesktop(); 
              }, 300);
          }
          document.getElementById('ctx').style.display = 'none';
      }

      function updateApp(idx) {
          state.apps[idx].n = document.getElementById('ed-n').value; state.apps[idx].i = document.getElementById('ed-i').value || 'fa-solid fa-cube';
          save(); renderDesktop(); document.getElementById('win-Ed').remove();
      }

      function setTheme(t) { state.accent = t; document.documentElement.style.setProperty('--accent', t); save(); }
      function setWall(w) { state.wallpaper = w; document.getElementById('os-screen').style.backgroundImage = `url(${w})`; save(); }

      function dragWin(el, e) {
          if(el.classList.contains('maximized')) return;
          e.preventDefault();
          
          let startX = e.clientX, startY = e.clientY;
          let origLeft = el.offsetLeft, origTop = el.offsetTop;
          
          focusWin(el.id.replace('win-',''));

          const onDrag = (me) => {
              window.requestAnimationFrame(() => {
                  el.style.left = (origLeft + (me.clientX - startX)) + "px";
                  el.style.top = (origTop + (me.clientY - startY)) + "px";
              });
          };

          const stopDrag = () => {
              document.removeEventListener('mousemove', onDrag);
              document.removeEventListener('mouseup', stopDrag);
          };

          document.addEventListener('mousemove', onDrag);
          document.addEventListener('mouseup', stopDrag);
      }

      function updateTaskbar() { const tb = document.getElementById('tb-active'); tb.innerHTML = ''; document.querySelectorAll('.window').forEach(w => { if(w.style.zIndex < 20000) { const item = document.createElement('div'); item.className='tb-item'; item.innerHTML=w.dataset.icon.startsWith('fa')?`<i class="${w.dataset.icon}"></i>`:`<img src="${w.dataset.icon}" width="24">`; item.onclick=()=> { w.classList.toggle('minimized'); if(!w.classList.contains('minimized')) focusWin(w.id.replace('win-','')); }; tb.appendChild(item); } }); }

      window.onclick = () => document.getElementById('ctx').style.display = 'none';
      document.documentElement.style.setProperty('--accent', state.accent);
      document.getElementById('os-screen').style.backgroundImage = `url(${state.wallpaper})`;
      renderDesktop();
    </script>
  </body>
</html>
